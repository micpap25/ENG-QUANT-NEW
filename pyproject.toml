[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eng-quant"
version = "0.1.0"
description = "Optimization modeling, relaxation, and interior-point solver experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.9",
  "gurobipy",
  "highspy",
  "pymatting",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["eng_quant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
